name: Update GA4 statistics

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install google-analytics-data
      - name: Query Google Analytics
        env:
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: python scripts/update_ga_stats.py "$RUNNER_TEMP/analytics.json"
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published-site
      - name: Publish statistics
        run: |
          cp "$RUNNER_TEMP/analytics.json" published-site/analytics.json
          cd published-site
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics.json
          git commit -m "Update GA4 statistics"
          git push
